[package]
name = "port_scanner"
version = "0.0.1"
edition = "2024"
authors = ["Joebert Cerezo <joebertcerezo@gmail.com>"]
repository = "https://github.com/joebertcerezo/port_scanner.git"
homepage = "https://github.com/joebertcerezo/port_scanner.git"
description = "Simple asynchronous TCP port scanner implemented in Rust."

[dependencies]
bpaf = { version = "0.9.27", features = ["derive"] }
futures = "0.3.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "net",
  "time",
  "rt-multi-thread",
  "macros",
] }
